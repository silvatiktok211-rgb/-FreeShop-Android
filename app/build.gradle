plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.afilishop.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.afilishop.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        def supabaseUrl = project.findProperty("SUPABASE_URL") ?: System.getenv("SUPABASE_URL") ?: ""
        def supabaseAnonKey = project.findProperty("SUPABASE_ANON_KEY") ?: System.getenv("SUPABASE_ANON_KEY") ?: ""
        def apiBaseUrl = project.findProperty("API_BASE_URL") ?: System.getenv("API_BASE_URL") ?: "https://afilishop.lovable.app"
        def firebaseApiKey = project.findProperty("FIREBASE_API_KEY") ?: System.getenv("FIREBASE_API_KEY") ?: ""
        def firebaseAppId = project.findProperty("FIREBASE_APP_ID") ?: System.getenv("FIREBASE_APP_ID") ?: ""
        def firebaseProjectId = project.findProperty("FIREBASE_PROJECT_ID") ?: System.getenv("FIREBASE_PROJECT_ID") ?: ""
        def firebaseSenderId = project.findProperty("FIREBASE_SENDER_ID") ?: System.getenv("FIREBASE_SENDER_ID") ?: ""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${firebaseApiKey.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${firebaseAppId.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${firebaseProjectId.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_SENDER_ID", "\"${firebaseSenderId.replace('\\', '\\\\').replace('"', '\\"')}\""
        manifestPlaceholders = [
            appLabel: "AfiliShop",
            supabaseUrl: supabaseUrl
        ]
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true; buildConfig true }
    packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.04.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.9"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.datastore:datastore-preferences:1.1.2"
    implementation "com.google.firebase:firebase-messaging:24.1.2"
    implementation "com.android.billingclient:billing-ktx:7.1.1"
    implementation "androidx.media3:media3-exoplayer:1.6.1"
    implementation "androidx.media3:media3-ui:1.6.1"
    implementation "io.agora.rtc:full-sdk:4.5.0"
    implementation "io.coil-kt.coil3:coil-compose:3.1.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.1.0"
    implementation "io.ktor:ktor-client-android:3.1.2"
    implementation "io.ktor:ktor-client-content-negotiation:3.1.2"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.1.2"
    implementation "io.github.jan-tennert.supabase:auth-kt:3.1.4"
    implementation "io.github.jan-tennert.supabase:postgrest-kt:3.1.4"
    implementation "io.github.jan-tennert.supabase:storage-kt:3.1.4"
    implementation "io.github.jan-tennert.supabase:realtime-kt:3.1.4"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.0.21"
}
