import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

// A configuração do cliente Firebase é pública, mas o App ID precisa ser o
// registro Android correto (não o App ID "web"). Se google-services.json estiver
// presente, o Gradle extrai os clientes de produção e preview sem aplicar o
// plugin Google Services nem misturar autenticação Google com FCM.
def firebaseConfigFile = file("google-services.json")
def firebaseConfig = firebaseConfigFile.exists()
    ? new JsonSlurper().parse(firebaseConfigFile)
    : null
def firebaseClientFor = { String packageName ->
    (firebaseConfig?.client ?: []).find { client ->
        client?.client_info?.android_client_info?.package_name == packageName
    }
}
def firebaseProductionClient = firebaseClientFor("com.afilishop.app")
def firebasePreviewClient = firebaseClientFor("com.afilishop.app.debug")
def firebaseProjectInfo = firebaseConfig?.project_info
def firebaseApiKeyValue = project.findProperty("FIREBASE_API_KEY") ?:
    System.getenv("FIREBASE_API_KEY") ?:
    firebaseProductionClient?.api_key?.find { it.current_key }?.current_key ?:
    firebasePreviewClient?.api_key?.find { it.current_key }?.current_key ?:
    ""
def firebaseProjectIdValue = project.findProperty("FIREBASE_PROJECT_ID") ?:
    System.getenv("FIREBASE_PROJECT_ID") ?:
    firebaseProjectInfo?.project_id ?:
    ""
def firebaseSenderIdValue = project.findProperty("FIREBASE_SENDER_ID") ?:
    System.getenv("FIREBASE_SENDER_ID") ?:
    firebaseProjectInfo?.project_number ?:
    ""
def firebaseProductionAppId = project.findProperty("FIREBASE_APP_ID") ?:
    System.getenv("FIREBASE_APP_ID") ?:
    firebaseProductionClient?.client_info?.mobilesdk_app_id ?:
    ""
def firebasePreviewAppId = project.findProperty("FIREBASE_PREVIEW_APP_ID") ?:
    System.getenv("FIREBASE_PREVIEW_APP_ID") ?:
    firebasePreviewClient?.client_info?.mobilesdk_app_id ?:
    firebaseProductionAppId

android {
    namespace "com.afilishop.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.afilishop.app"
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName "1.4.12"

        def supabaseUrl = project.findProperty("SUPABASE_URL") ?: System.getenv("SUPABASE_URL") ?: ""
        def supabaseAnonKey = project.findProperty("SUPABASE_ANON_KEY") ?: System.getenv("SUPABASE_ANON_KEY") ?: ""
        def apiBaseUrl = project.findProperty("API_BASE_URL") ?: System.getenv("API_BASE_URL") ?: "https://afilishop.lovable.app"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${firebaseApiKeyValue.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${firebaseProductionAppId.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${firebaseProjectIdValue.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "FIREBASE_SENDER_ID", "\"${firebaseSenderIdValue.replace('\\', '\\\\').replace('"', '\\"')}\""
        manifestPlaceholders = [
            appLabel: "AfiliShop",
            supabaseUrl: supabaseUrl
        ]
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    def releaseStorePath = System.getenv("AFILISHOP_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("AFILISHOP_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("AFILISHOP_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("AFILISHOP_KEY_PASSWORD")
    def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() } && file(releaseStorePath ?: "missing").exists()

    def previewStorePath = System.getenv("AFILISHOP_PREVIEW_KEYSTORE_PATH")
    def hasPreviewSigning = previewStorePath != null &&
        !previewStorePath.trim().isEmpty() && file(previewStorePath).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            playUpload {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
        if (hasPreviewSigning) {
            stablePreview {
                storeFile file(previewStorePath)
                storePassword "afilishop-preview"
                keyAlias "afilishop-preview"
                keyPassword "afilishop-preview"
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "FIREBASE_APP_ID", "\"${firebasePreviewAppId.replace('\\', '\\\\').replace('"', '\\"')}\""
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.playUpload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            applicationIdSuffix ".debug"
            versionNameSuffix "-preview"
            buildConfigField "String", "FIREBASE_APP_ID", "\"${firebasePreviewAppId.replace('\\', '\\\\').replace('"', '\\"')}\""
            signingConfig hasPreviewSigning ? signingConfigs.stablePreview : signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true; buildConfig true }
    packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.04.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
