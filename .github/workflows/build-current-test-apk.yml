name: Build Current AfiliShop Test APK

on:
  push:
    branches:
      - build/afilishop-current-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$apk" ]; then apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"; fi
          test -n "$apk" && test -s "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" AfiliShop-Atualizado-v1.4.12.apk
          sha256sum AfiliShop-Atualizado-v1.4.12.apk
          ls -lh AfiliShop-Atualizado-v1.4.12.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AfiliShop-Atualizado-v1.4.12
          path: AfiliShop-Atualizado-v1.4.12.apk
          if-no-files-found: error
      - name: Publish stable public test link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="afilishop-test-v1.4.12-current"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" \
            "AfiliShop-Atualizado-v1.4.12.apk#AfiliShop Android 1.4.12 teste" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AfiliShop Android 1.4.12 - teste atualizado" \
            --notes "APK público de teste da versão Android atualizada." \
            --prerelease
