name: APK Builder Smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apk-builder-smoke.yml"
      - ".apk-builder-trigger"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "PUBLIC_RUNNER_OK"
          java -version
